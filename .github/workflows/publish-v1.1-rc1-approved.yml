name: Publish v1.1.0-rc.1 (one-time authorized prerelease)

# An inert workflow unless an exact authorization commit lands on the RC branch.
# Never triggers on main, PRs, unrelated commits or other versions.
on:
  push:
    branches:
      - release/v1.1.0-rc.1

permissions:
  contents: read

concurrency:
  group: resource-queue-manager-publish-v1.1.0-rc.1
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event.head_commit.message == 'release: authorize v1.1.0-rc.1 prerelease'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact branch, approved commit and RC metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/release/v1.1.0-rc.1" || exit 1
          test "$(git log -1 --format=%s)" = "release: authorize v1.1.0-rc.1 prerelease" || exit 1
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/resource_queue_manager/manifest.json").read_text())
          hacs = json.loads(Path("hacs.json").read_text())
          assert manifest["version"] == "1.1.0-rc.1", "Unexpected manifest version"
          assert manifest["name"] == hacs["name"], "HACS / manifest mismatch"
          notes = Path("docs/releases/v1.1.0-rc.1.md").read_text(encoding="utf-8")
          assert notes.startswith("# Resource Queue Manager — v1.1.0-rc.1"), "Wrong RC release notes"
          assert Path("docs/MIGRATION_v1.0_to_v1.1.md").exists()
          assert Path("docs/RELEASE_CHECKLIST_v1.1.md").exists()
          PY
          if gh release view v1.1.0-rc.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::RC already released; refusing to overwrite"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.1.0-rc.1" >/dev/null 2>&1; then
            echo "::error::Tag already exists; refusing to overwrite"; exit 1
          fi

  core:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  home-assistant:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install "pytest-homeassistant==2026.11.1"
      - run: python -m pytest -q tests/ha

  hacs:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  publish:
    needs: [core, home-assistant, hacs, hassfest]
    if: github.ref == 'refs/heads/release/v1.1.0-rc.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish immutable GitHub pre-release (never latest stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0-rc.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.1.0-rc.1" >/dev/null 2>&1; then
            echo "::error::Tag already exists"; exit 1
          fi
          gh release create v1.1.0-rc.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Resource Queue Manager v1.1.0-rc.1" \
            --notes-file docs/releases/v1.1.0-rc.1.md \
            --prerelease
          test "$(gh release view v1.1.0-rc.1 --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = "true"
